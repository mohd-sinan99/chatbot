version: '3.8'

services:
  travel-planner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-travel-planner
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
    restart: unless-stopped

